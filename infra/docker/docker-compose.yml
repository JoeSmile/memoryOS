# MemoryOS — EP03 PG+Redis（默认）· EP08 full profile（web+api+nginx）
#
# 仅数据库（与 pnpm db:up 相同）:
#   docker compose up -d
#
# 全栈（需先 build 镜像，见 infra/docker/README.md）:
#   docker compose --env-file .env.deployment.local --profile full up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: memoryos-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: memoryos
      POSTGRES_PASSWORD: memoryos
      POSTGRES_DB: memoryos
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoryos -d memoryos"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: memoryos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    profiles: [full]
    image: ${API_IMAGE:-memoryos-api:local}
    container_name: memoryos-api
    restart: unless-stopped
    env_file:
      - path: .env.deployment.local
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://memoryos:memoryos@postgres:5432/memoryos}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    profiles: [full]
    image: ${WEB_IMAGE:-memoryos-web:local}
    container_name: memoryos-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      API_UPSTREAM_URL: ${API_UPSTREAM_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://127.0.0.1:3000/'',r=>process.exit(r.statusCode<500?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    profiles: [full]
    image: nginx:1.27-alpine
    container_name: memoryos-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    # SSE routing: infra/nginx/default.conf

volumes:
  postgres-data:
  redis-data:
